name: Update Delphi dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos (UTC)
  workflow_dispatch:          # permite rodar na mao pelo botao "Run workflow"

# Sem gatilho por push: subir codigo nao precisa disparar uma coleta, e era isso
# que colidia com a execucao agendada e gerava e-mail de "job cancelled".

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false   # se duas coincidirem, a segunda espera em vez de matar a primeira

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull aggregate counts from REDCap
        env:
          REDCAP_API_URL: ${{ secrets.REDCAP_API_URL }}
          REDCAP_API_TOKEN: ${{ secrets.REDCAP_API_TOKEN }}
          EXCLUDE_EMAILS: ${{ secrets.EXCLUDE_EMAILS }}
        run: python redcap_aggregate.py

      - name: Abortar se algum arquivo sensivel entrou no repositorio
        run: |
          for f in .env registros.txt paises_inferidos.txt metadata.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "PARADO: $f esta versionado e nao deveria estar."
              exit 1
            fi
          done
          echo "nenhum arquivo sensivel versionado"

      - name: Commit data.json if it changed
        # As credenciais precisam existir TAMBEM aqui: se o remote andar durante
        # o job, o laco abaixo roda o agregador de novo para regerar o arquivo.
        env:
          REDCAP_API_URL: ${{ secrets.REDCAP_API_URL }}
          REDCAP_API_TOKEN: ${{ secrets.REDCAP_API_TOKEN }}
          EXCLUDE_EMAILS: ${{ secrets.EXCLUDE_EMAILS }}
        run: |
          git config user.name  "delphi-dashboard-bot"
          git config user.email "actions@github.com"

          if [ -z "$(git status --porcelain data.json)" ]; then
            echo "sem mudancas"
            exit 0
          fi

          git add data.json
          git commit -m "chore: refresh counts $(date -u +'%Y-%m-%dT%H:%MZ')"

          # Se o remote andou durante o job, NAO fazemos merge nem rebase deste
          # arquivo: o git juntaria linha a linha duas versoes do JSON e produziria
          # um arquivo incoerente. Em vez disso descartamos nosso commit, voltamos
          # ao estado do servidor e geramos o data.json de novo, inteiro.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "publicado na tentativa $i"
              exit 0
            fi
            echo "remote mudou; regerando do zero (tentativa $i)"
            git fetch origin main
            git reset --hard origin/main
            python redcap_aggregate.py
            if [ -z "$(git status --porcelain data.json)" ]; then
              echo "sem mudancas apos regerar"
              exit 0
            fi
            git add data.json
            git commit -m "chore: refresh counts $(date -u +'%Y-%m-%dT%H:%MZ')"
            sleep 3
          done

          echo "nao consegui publicar depois de 5 tentativas"
          exit 1
